name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing to tell us; let it go rather than pay for a
# full engine download and two exports to report on a commit nobody is
# looking at any more.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: stamp_version.py derives the version name from
      # `git describe` and the fallback code from the commit count, and a
      # depth-1 checkout has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First, because it is seconds and everything below it costs minutes.
      # gdparse catches a syntax error before the suite has to discover it as
      # a missing "All tests passed", and gdformat keeps the diff noise out of
      # review. Pinned: gdtoolkit tracks Godot versions and a floating one
      # would break CI on its own schedule.
      - name: Lint and format check
        run: |
          set -euo pipefail
          pip install --quiet gdtoolkit==4.5.0 ruff==0.14.0
          for f in scripts/*.gd test/*.gd; do
            gdparse "$f" > /dev/null || { echo "::error file=$f::failed to parse"; exit 1; }
          done
          echo "all GDScript parses"
          gdformat --check scripts/ test/
          gdlint scripts/ test/
          ruff check tools/
          ruff format --check tools/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Godot's Gradle build needs the SDK; the runner ships one, so just
      # point at it rather than downloading another.
      - name: Report Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

          curl -fsSL -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv /tmp/tpl/templates/* "$dest/"

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - uses: extractions/setup-just@v3

      # 82MB of prebuilt vendor binaries plus GUT, re-downloaded on every run
      # until now. The justfile pins both versions, so it is the cache key:
      # editing it re-fetches, which is conservative but never serves a stale
      # addon.
      - name: Cache the OpenXR vendors addon and GUT
        id: addons-cache
        uses: actions/cache@v4
        with:
          path: addons
          key: addons-${{ hashFiles('justfile') }}

      - name: Fetch OpenXR vendors addon
        if: steps.addons-cache.outputs.cache-hit != 'true'
        run: just setup

      # A real signing identity if one is configured, a throwaway otherwise.
      # The throwaway is regenerated every run, so no two CI builds share a
      # signature: fine for `adb install`, useless for distribution, because
      # an update signed by a different key is refused.
      - name: Resolve the release signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/keystore
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/keystore/release.keystore
            echo "keystore=$HOME/keystore/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed with the configured release key"
          else
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 10000 \
              -keystore ~/keystore/debug.keystore
            echo "keystore=$HOME/keystore/debug.keystore" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret is set; this APK is signed with a throwaway key and cannot be distributed."
          fi

      # Without this every build calls itself version 1, and two of them
      # cannot coexist anywhere that keys on version code.
      - name: Stamp the build version
        run: |
          python3 tools/stamp_version.py
          grep -E '^version/(code|name)=' export_presets.cfg

      # Godot's headless editor reliably aborts on teardown under CI (exit 134)
      # after the work itself has finished, so these steps assert on what they
      # produced rather than on an exit code.
      - name: Import project
        run: |
          godot --headless --import || true
          test -n "$(find .godot/imported -type f 2>/dev/null)" \
            || { echo "::error::import produced no resources"; exit 1; }
          echo "imported $(find .godot/imported -type f | wc -l) resources"

      - name: Regression suite
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd \
            -gdir=res://test -gexit -gprefix=test_ 2>&1 | tee /tmp/gut.log
          grep -q "All tests passed" /tmp/gut.log \
            || { echo "::error::regression suite failed"; exit 1; }

      - name: Smoke test
        run: |
          godot --headless --quit-after 1200 2>&1 | tee /tmp/smoke.log || true
          if grep -qE "SCRIPT ERROR|Parse Error|Invalid call|Nonexistent" /tmp/smoke.log; then
            echo "::error::script errors during smoke test"
            grep -E "SCRIPT ERROR|Parse Error|Invalid call|Nonexistent" /tmp/smoke.log
            exit 1
          fi
          echo "smoke test clean"

      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ steps.signing.outputs.keystore }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.ANDROID_KEYSTORE_USER || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.signing.outputs.keystore }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p build
          godot --headless --install-android-build-template \
            --export-release "Quest" build/paddleball-release.apk || true
          test -s build/paddleball-release.apk \
            || { echo "::error::export produced no APK"; exit 1; }
          ls -lh build/paddleball-release.apk

      - name: Verify the APK targets Quest
        run: |
          set -euo pipefail
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          tree="$("$aapt2" dump xmltree --file AndroidManifest.xml build/paddleball-release.apk)"
          grep -q "com.oculus.intent.category.VR" <<<"$tree"
          grep -q "questpro" <<<"$tree"
          echo "manifest declares Quest VR entry points"

      # Steam Frame runs SteamOS on ARM, so its standalone build is a Linux
      # arm64 binary rather than an APK. It shares the engine and export
      # templates the Quest build already set up and needs no JDK, SDK or
      # keystore, so it rides along in this job rather than paying for its
      # own.
      - name: Export the Steam Frame build
        run: |
          set -euo pipefail
          godot --headless --export-release "Steam Frame" build/paddlequest.arm64 || true
          test -s build/paddlequest.arm64 \
            || { echo "::error::Steam Frame export produced no binary"; exit 1; }
          ls -lh build/paddlequest.arm64

      - name: Verify the Steam Frame build is arm64
        run: |
          set -euo pipefail
          out="$(file -b build/paddlequest.arm64)"
          echo "$out"
          grep -q "ARM aarch64" <<<"$out" \
            || { echo "::error::expected an ARM aarch64 ELF, got: $out"; exit 1; }
          echo "Steam Frame binary is arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: paddleball-release-apk
          path: build/paddleball-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: paddlequest-steamframe-arm64
          path: build/paddlequest.arm64
