name: Godot 4.8 trial

# Opt-in. workflow_dispatch only, so it is not part of the pull-request or
# push build and cannot fail the stable gate. The stable editor, templates
# and exports stay on GODOT_VERSION in build.yml.
on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: godot-builds release tag to try (e.g. 4.8-beta5, 4.8-rc1)
        required: true
        default: 4.8-beta5

permissions:
  contents: read

env:
  # Through env, not interpolated into the script, so the input is data.
  GODOT_TRIAL_TAG: ${{ inputs.godot_version }}

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The hosted runner already has an Android SDK. Point at it the same
      # way the stable workflow does; the trial does not install a second one.
      - name: Report Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache trial downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/paddlequest/godot-trial/downloads
          key: godot-trial-${{ inputs.godot_version }}-${{ hashFiles('tools/godot_48_trial.sh', '.github/workflows/build.yml', '.devcontainer/Dockerfile') }}

      - name: Run the ${{ inputs.godot_version }} trial
        run: bash tools/godot_48_trial.sh
