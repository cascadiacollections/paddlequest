// Standalone: this module is not part of the Godot Android build template under
// android/, which is generated and gitignored. `just shim` builds it here and
// drops the AAR into android/plugins/ where the export picks it up.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'jukebox-shim'
